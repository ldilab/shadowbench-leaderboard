# Example LiteLLM proxy config for local ShadowBench testing.
#
# 1. Copy to litellm.config.yaml (that name is git-ignored).
# 2. Export your key:   export OPENROUTER_API_KEY=sk-or-...
# 3. Run the proxy:     litellm --config litellm.config.yaml --port 4000
#
# On the submit form (served from localhost, so the local test panel is visible):
#   Model endpoint = the proxy's /v1 base   (e.g. http://localhost:4000/v1)
#   Model id       = test-model
#   API key        = leave blank unless you set a master_key below
#
# Reachability: the eval backend calls this endpoint, not your browser. A proxy on
# your laptop is not reachable from the backend. Expose it with a tunnel, e.g.
#   cloudflared tunnel --url http://localhost:4000
# and use the resulting https URL (…/v1) as the endpoint. For a quick check you can
# skip LiteLLM entirely and point the endpoint at https://openrouter.ai/api/v1 with
# your key in the API key field.

model_list:
  - model_name: test-model
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

litellm_settings:
  drop_params: true

# Optional: require a key from callers. If set, put it in the form's API key field.
# general_settings:
#   master_key: sk-local-test
